name: TEMP keystore diagnostic (diag/v2-keystore only)

# تشخيص مؤقت لمرة واحدة: لماذا لا يفتح BINAA_V2_KEYSTORE_PASSWORD الملف BINAA_V2_KEYSTORE_BASE64؟
# لا يطبع كلمة السر ولا الـBase64 ولا أي جزء منهما: فقط حجم الملف وبصمته، ونتائج YES/NO، وبيانات عامة.
on:
  push:
    branches: ['diag/v2-keystore']

permissions:
  contents: read

jobs:
  diagnose:
    name: V2 keystore diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Diagnose (no secret is printed)
        env:
          BINAA_V2_KEYSTORE_BASE64: ${{ secrets.BINAA_V2_KEYSTORE_BASE64 }}
          BINAA_V2_KEYSTORE_PASSWORD: ${{ secrets.BINAA_V2_KEYSTORE_PASSWORD }}
          EXPECTED_SHA256: "56:8E:B9:17:2C:4D:A8:BE:D7:D2:9D:C5:FA:D5:F3:BF:18:04:C3:C1:5A:7E:2C:3D:4E:69:62:D7:55:76:DF:0F"
        run: |
          set -u
          KS="$RUNNER_TEMP/binaa-ocr-v2.jks"
          OUT="$RUNNER_TEMP/keytool.out"
          trap 'rm -f "$KS" "$OUT"' EXIT

          # نفس طريقة الفك المستخدمة في android.yml.
          if echo "$BINAA_V2_KEYSTORE_BASE64" | base64 -d > "$KS" 2>/dev/null; then decode=OK; else decode=FAILED; fi
          echo "0. Base64 decode: $decode"

          echo "1. Decoded file size (bytes): $(stat -c%s "$KS")"
          echo "2. Decoded file SHA-256: $(sha256sum "$KS" | awk '{print $1}')"

          case "$BINAA_V2_KEYSTORE_PASSWORD" in
            *[[:space:]]) trailing=YES ;;
            *) trailing=NO ;;
          esac
          echo "3. Password ends with newline/space: $trailing"

          if keytool -list -v -keystore "$KS" -storepass:env BINAA_V2_KEYSTORE_PASSWORD > "$OUT" 2>&1; then opened=SUCCESS; else opened=FAILURE; fi
          echo "4. keytool opens the keystore with the current password: $opened"
          [ "$opened" = FAILURE ] && grep -m1 '^keytool error' "$OUT" | sed 's/^/   keytool says: /'

          magic=$(head -c4 "$KS" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            feedfeed) byfile=JKS ;;
            cececece) byfile=JCEKS ;;
            30*) byfile="PKCS12 (DER)" ;;
            0000000[12]) byfile=BKS ;;
            *) byfile="unknown (first bytes $magic)" ;;
          esac
          echo "5. Keystore type from the file's bytes: $byfile"
          if [ "$opened" = SUCCESS ]; then
            echo "   Keystore type (keytool): $(grep -m1 '^Keystore type:' "$OUT" | sed 's/^Keystore type: //')"
            echo "   Aliases: $(grep '^Alias name:' "$OUT" | sed 's/^Alias name: //' | paste -sd, -)"
          else
            echo "   Keystore type/aliases (keytool): unavailable (keystore could not be opened)"
          fi

          if printf '%s' "$BINAA_V2_KEYSTORE_PASSWORD" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then nonlatin=YES; else nonlatin=NO; fi
          echo "6. Password contains non-Latin (non-ASCII) characters: $nonlatin"

          if [ "$opened" = SUCCESS ]; then
            actual=$(grep -m1 -E '^\s*SHA256:' "$OUT" | sed -E 's/^\s*SHA256:\s*//')
            norm() { tr -d ': \n' | tr 'a-f' 'A-F'; }
            echo "7. Certificate SHA-256 (first entry): $actual"
            echo "   Expected:                          $EXPECTED_SHA256"
            if [ "$(printf '%s' "$actual" | norm)" = "$(printf '%s' "$EXPECTED_SHA256" | norm)" ]; then
              echo "   Match: YES"
            else
              echo "   Match: NO"
            fi
          else
            echo "7. Certificate SHA-256: unavailable (keystore could not be opened)"
          fi
