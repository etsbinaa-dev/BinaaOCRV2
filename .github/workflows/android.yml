name: Android build & tests

on:
  push:
  workflow_dispatch:

# دفعة جديدة على الفرع نفسه تلغي البناء القديم الجاري (توفير دقائق Actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint, release APK checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # لنشر نسخة التثبيت في «Releases» (تخزين منفصل عن حصة ملفات Actions).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Repository hygiene (no images, no keys, no picker, no corpus)
        run: ./scripts/check-repo.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # مفتاح V2 الدائم من GitHub Secrets. بدونه يفشل البناء عمدًا: لا APK إصدار بمفتاح مؤقت لا يقبل التحديث.
      - name: Restore V2 signing keystore
        env:
          BINAA_V2_KEYSTORE_BASE64: ${{ secrets.BINAA_V2_KEYSTORE_BASE64 }}
          BINAA_V2_KEYSTORE_PASSWORD: ${{ secrets.BINAA_V2_KEYSTORE_PASSWORD }}
        run: |
          for s in BINAA_V2_KEYSTORE_BASE64 BINAA_V2_KEYSTORE_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::GitHub Secret $s is not set; refusing to build a release APK with a throwaway key (see README)."
              exit 1
            fi
          done
          echo "$BINAA_V2_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/binaa-ocr-v2.jks"
          echo "BINAA_V2_KEYSTORE_PATH=$RUNNER_TEMP/binaa-ocr-v2.jks" >> "$GITHUB_ENV"

      - name: Unit tests + lint + debug & release APKs
        env:
          BINAA_V2_KEYSTORE_PASSWORD: ${{ secrets.BINAA_V2_KEYSTORE_PASSWORD }}
          # الاسم المستعار ليس سرًّا. وفي مخزن PKCS12 كلمة سر المفتاح = كلمة سر المخزن.
          BINAA_V2_KEY_ALIAS: binaa-ocr-v2
          BINAA_V2_KEY_PASSWORD: ${{ secrets.BINAA_V2_KEYSTORE_PASSWORD }}
        run: ./gradlew :core:test :golden-corpus:test :header-engine:test testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/binaa-ocr-v2.jks"

      - name: Check release APK (id, name, icon, permissions, no picker/corpus, V2 signature)
        run: ./scripts/check-release-apk.sh

      # نسخة التثبيت في «Releases»: رابط ثابت، وتخزين لا يدخل في حصة ملفات Actions. فقط إذا نجح كل ما سبق.
      - name: Publish release APK (GitHub Releases)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase-2-header'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}
          cp app/build/outputs/apk/release/app-release.apk "binaa-ocr-v2-$short.apk"
          gh release create "v2-build-${GITHUB_RUN_NUMBER}" "binaa-ocr-v2-$short.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Binaa OCR V2 ($short)" \
            --notes "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_REF_NAME} at ${short}. Install the APK over the previous version."

      # يُرفع الـAPK فقط إذا نجح كل ما سبق (بما فيه التحقق من مفتاح V2).
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        # حصة ملفات Actions الممتلئة لا تُفشل البناء: نسخة التثبيت منشورة في «Releases».
        continue-on-error: true
        with:
          name: binaa-ocr-v2-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          # حصة تخزين GitHub محدودة: نسخة التثبيت 30 يومًا تكفي (كل نسخة جديدة تحل محل ما قبلها).
          retention-days: 30

      # نسخة debug (com.binaa.ocr.debug) لتشغيل Golden Corpus على الهاتف بـ adb فقط. موقّعة بمفتاح debug مؤقت
      # يتغير مع كل تشغيل CI: تثبيتها فوق نسخة debug أقدم قد يتطلب حذف القديمة أولًا (انظر README).
      - name: Upload debug APK (Golden Corpus runner)
        uses: actions/upload-artifact@v4
        # حصة ملفات Actions الممتلئة لا تُفشل البناء: نسخة التثبيت منشورة في «Releases».
        continue-on-error: true
        with:
          name: binaa-ocr-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        # حصة ملفات Actions الممتلئة لا تُفشل البناء: نسخة التثبيت منشورة في «Releases».
        continue-on-error: true
        with:
          name: build-reports
          retention-days: 7
          path: |
            ci-output/
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # محاكٍ واحد (الأقرب للهاتف) لتوفير دقائق Actions.
        api-level: [36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: |
          df -h /home/runner
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /home/runner

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/ci-instrumented.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        # حصة ملفات Actions الممتلئة لا تُفشل البناء: نسخة التثبيت منشورة في «Releases».
        continue-on-error: true
        with:
          name: instrumented-api-${{ matrix.api-level }}
          retention-days: 7
          path: |
            ci-output/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
